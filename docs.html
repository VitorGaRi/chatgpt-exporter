<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChatGPT Exporter</title>
  <link rel="icon" href="icons/icon32.png">
  <style>
    :root {
      --bg: #ffffff; --fg: #1f2328; --muted: #6b7280; --border: #e5e7eb;
      --code-bg: #f3f4f6; --accent: #0f766e;
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1e1f22; --fg: #e6e6e6; --muted: #9ca3af; --border: #34363b;
              --code-bg: #2a2c30; --accent: #2dd4bf; }
    }
    body {
      margin: 0; padding: 32px 16px 64px;
      background: var(--bg); color: var(--fg);
      font: 15px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { max-width: 760px; margin: 0 auto; }
    nav { font-size: 13px; color: var(--muted); margin-bottom: 24px; }
    nav a { color: var(--muted); }
    a { color: var(--accent); }
    h1, h2, h3 { line-height: 1.25; }
    h1 { font-size: 26px; }
    h2 { font-size: 20px; margin-top: 32px; padding-bottom: 4px; border-bottom: 1px solid var(--border); }
    h3 { font-size: 16px; margin-top: 20px; }
    code { background: var(--code-bg); padding: 1px 5px; border-radius: 4px; font-size: .9em; }
    pre { background: var(--code-bg); padding: 12px 14px; border-radius: 6px; overflow-x: auto; }
    pre code { background: none; padding: 0; }
    ul, ol { padding-left: 24px; }
  </style>
</head>
<body>
  <main>
    <nav>
      <a href="docs.html?f=README.md">README</a> ·
      <a href="docs.html?f=CHANGELOG.md">Changelog</a> ·
      <span id="version"></span>
    </nav>
    <article id="content">Loading…</article>
  </main>
  <script src="docs.js"></script>
</body>
</html>
